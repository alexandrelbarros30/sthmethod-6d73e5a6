<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="512" height="512" rx="128" fill="black"/>
  <!-- Master V1: Fusão Biomecânica (Refined) -->
  
  <!-- Outer Glow for the whole group -->
  <circle cx="256" cy="256" r="180" fill="url(#glow)" opacity="0.15"/>
  
  <!-- Core Integration Node (IA) -->
  <circle cx="256" cy="256" r="40" fill="white" opacity="0.1"/>
  <circle cx="256" cy="256" r="20" fill="white">
    <animate attributeName="r" values="18;22;18" dur="3s" repeatCount="indefinite" />
  </circle>
  
  <!-- Musculação (Dumbbell - Top) -->
  <g transform="translate(256, 120)">
    <path d="M-60 0H60" stroke="#CCFF00" stroke-width="28" stroke-linecap="round"/>
    <rect x="-75" y="-30" width="30" height="60" rx="8" fill="#CCFF00"/>
    <rect x="45" y="-30" width="30" height="60" rx="8" fill="#CCFF00"/>
    <line x1="0" y1="20" x2="0" y2="100" stroke="#CCFF00" stroke-width="4" stroke-dasharray="8 8" opacity="0.3"/>
  </g>
  
  <!-- Nutrição (Apple - Bottom Left) -->
  <g transform="translate(140, 360)">
    <path d="M0 -40C-35 -40 -55 -20 -55 20C-55 60 -35 80 0 80C35 80 55 60 55 20C55 -20 35 -40 0 -40Z" fill="#10B981"/>
    <path d="M0 -40C0 -55 10 -65 20 -70" stroke="#10B981" stroke-width="12" stroke-linecap="round"/>
    <line x1="30" y1="-20" x2="100" y2="-80" stroke="#10B981" stroke-width="4" stroke-dasharray="8 8" opacity="0.3"/>
  </g>
  
  <!-- Exames (Activity/Pulse - Bottom Right) -->
  <g transform="translate(372, 360)">
    <path d="M-60 0H-30L-15 -50L15 50L30 0H60" stroke="#3B82F6" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-30" y1="-20" x2="-100" y2="-80" stroke="#3B82F6" stroke-width="4" stroke-dasharray="8 8" opacity="0.3"/>
  </g>

  <!-- Neural Connections -->
  <path d="M256 148 L256 236" stroke="white" stroke-width="2" opacity="0.2"/>
  <path d="M185 340 L236 276" stroke="white" stroke-width="2" opacity="0.2"/>
  <path d="M327 340 L276 276" stroke="white" stroke-width="2" opacity="0.2"/>

  <defs>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(256 256) rotate(90) scale(200)">
      <stop stop-color="#CCFF00"/>
      <stop offset="1" stop-color="black" stop-opacity="0"/>
    </radialGradient>
  </defs>
</svg>