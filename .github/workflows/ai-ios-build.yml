name: STH AI — iOS Build (IPA + TestFlight)

on:
  workflow_dispatch:
    inputs:
      upload_testflight:
        description: 'Enviar para o TestFlight após o build'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build STH AI iOS app
    runs-on: macos-14
    env:
      CAP_ENV: production
      APP_TARGET: ai
      VITE_APP_TARGET: ai
      BUNDLE_ID: com.sthmethod.ai

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_15.4.app

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund

      - name: Bump app version (auto)
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const pkg = require('./package.json');
          const runNumber = Number.parseInt(process.env.RUN_NUMBER || '1', 10) || 1;
          const [major = 1, minor = 0] = String(pkg.version || '1.0.0').split('.').map((n) => Number.parseInt(n, 10) || 0);
          const versionName = `${major}.${minor}.${runNumber}`;
          pkg.version = versionName;
          fs.writeFileSync('./package.json', JSON.stringify(pkg, null, 2) + '\n');
          try { fs.mkdirSync('./public', { recursive: true }); } catch (_) {}
          fs.writeFileSync('./public/version.json', JSON.stringify({ version: versionName }) + '\n');
          console.log(`App version bumped to ${versionName}`);
          NODE

      - name: Build web (Vite)
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: npm run build

      - name: Add iOS platform (if missing)
        run: |
          if [ ! -d "ios" ]; then
            npx cap add ios
          fi

      - name: Use STH AI icon
        run: |
          mkdir -p resources
          cp public/pwa-ai-1024.png resources/icon.png
          cp public/pwa-ai-1024.png resources/splash.png

      - name: Generate app icons & splash
        run: |
          npm install --no-save --legacy-peer-deps @capacitor/assets@^3
          npx @capacitor/assets generate --ios --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000' --splashBackgroundColor '#000000' --splashBackgroundColorDark '#000000'

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Install CocoaPods
        working-directory: ios/App
        run: pod install --repo-update

      - name: Set iOS version & build number
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd ios/App
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" App/Info.plist || true
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $RUN_NUMBER" App/Info.plist || true
          echo "iOS version $VERSION ($RUN_NUMBER)"

      - name: Check signing secrets
        id: signing
        run: |
          if [ -n "${{ secrets.IOS_CERTIFICATE_BASE64 }}" ] \
            && [ -n "${{ secrets.IOS_CERTIFICATE_PASSWORD }}" ] \
            && [ -n "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" ] \
            && [ -n "${{ secrets.APPLE_TEAM_ID }}" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Secrets de assinatura ausentes — apenas build sem assinatura. Configure IOS_CERTIFICATE_BASE64, IOS_CERTIFICATE_PASSWORD, IOS_PROVISIONING_PROFILE_BASE64, APPLE_TEAM_ID (e APP_STORE_CONNECT_KEY_ID / ISSUER_ID / KEY_BASE64 para o TestFlight)."
          fi

      - name: Import certificate & provisioning profile
        if: steps.signing.outputs.ready == 'true'
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          KEYCHAIN=$RUNNER_TEMP/build.keychain
          KEYCHAIN_PASSWORD=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          echo "$IOS_CERTIFICATE_BASE64" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/sthai.mobileprovision
          PROFILE_UUID=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/sthai.mobileprovision | plutil -extract UUID raw -)
          PROFILE_NAME=$(security cms -D -i ~/Library/MobileDevice/Provisioning\ Profiles/sthai.mobileprovision | plutil -extract Name raw -)
          echo "PROFILE_UUID=$PROFILE_UUID" >> "$GITHUB_ENV"
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          rm -f "$RUNNER_TEMP/cert.p12"

      - name: Create ExportOptions.plist
        if: steps.signing.outputs.ready == 'true'
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          EOF

      - name: Archive (signed)
        if: steps.signing.outputs.ready == 'true'
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -archivePath "$RUNNER_TEMP/App.xcarchive" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            PRODUCT_BUNDLE_IDENTIFIER=$BUNDLE_ID \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive

      - name: Export IPA
        if: steps.signing.outputs.ready == 'true'
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/App.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Upload IPA artifact
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: sthai-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error

      - name: Upload to TestFlight
        if: steps.signing.outputs.ready == 'true' && inputs.upload_testflight
        env:
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_KEY_BASE64 }}
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_BASE64" ]; then
            echo "::warning::Secrets do App Store Connect ausentes — IPA gerado, mas envio ao TestFlight foi pulado."
            exit 0
          fi
          mkdir -p ~/private_keys
          echo "$ASC_KEY_BASE64" | base64 -d > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -n 1)
          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
          rm -f ~/private_keys/AuthKey_$ASC_KEY_ID.p8

      - name: Build unsigned (fallback sem secrets)
        if: steps.signing.outputs.ready != 'true'
        working-directory: ios/App
        run: |
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release \
            -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO build

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain" 2>/dev/null || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/sthai.mobileprovision 2>/dev/null || true